# dsh-maestro-core bundle patch.
#
# One package, four host rows. The daemon CLI (bin) and the standalone systemd
# unit are the supervisor's own runtime; the rows below are the modules that
# load inside DSH web.
#
# The supervisor row auto-resumes interrupted sessions after a DSH web restart.
# The standalone daemon (systemd) handles crash detection and web restart.
# Install with `dsh plugin --profile web add @ddtcorex/dsh-maestro-core`
- insert:
    - id: maestro-supervisor
      name: '@ddtcorex/dsh-maestro-core'
      config:
        autoResumeWithin: 5

    # Backup, restore, retention GC and the Maestro Sync settings section.
    # The row name is a subpath of this package, so `exports["./lib/*"]` has to
    # admit it: a name the exports map does not resolve is skipped silently at
    # boot. The name follows the package rename, not before it.
    - id: dsh-maestro-sync
      name: '@ddtcorex/dsh-maestro-core/lib/sync/index.js'
      channel: /dsh-maestro-sync
      # rpc.handle registers a webServer route inside an effect fiber
      # which carries only the row's inject (not the module's);
      # not sufficient on DSH 0.2.x on its own: see the `connection` entry at the end of this file.
      inject: ['tools', 'connection', 'webServer']

    # Guard rules, journal and approval prompts. The channel is declared by the
    # row only: guard exposes no rpc.handle today, it answers through the
    # harness approval prompt.
    - id: dsh-maestro-guard
      name: '@ddtcorex/dsh-maestro-core/lib/guard/index.js'
      channel: /dsh-maestro-guard

    # The Maestro settings card service over the shared namespaced store.
    # Same subpath name rule as the rows above.
    - id: maestro-config
      name: '@ddtcorex/dsh-maestro-core/lib/config/index.js'
      # rpc.handle registers a webServer route inside an effect fiber which
      # carries only the row's inject (not the module's); without webServer
      # the row fails on harnesses that provide webServer after rows apply (DSH 0.1.5-rc.1+); on DSH 0.2.x it is not sufficient on its own, see the `connection` entry at the end of this file.
      inject: ['connection', 'webServer']
      config: {}

# DSH 0.2.x resolves `webServer` for `ctx.connection.rpc.handle` on the
# `connection` row own fiber, so a row-level inject cannot reach it. `inject`
# replaces the base list, hence `webRuntime` (the base row needs it for
# trustedHosts) is repeated. Identical in every maestro package that registers
# RPC channels, so each one stays installable alone.
- id: connection
  inject:
    - webRuntime
    - webServer
